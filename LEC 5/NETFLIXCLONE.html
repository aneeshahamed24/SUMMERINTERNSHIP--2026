<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
        }

        .container{
            height:100vh;

            background:url("netflix1.jpg")
            center/cover no-repeat;

            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;

            color:white;
        }

        .content{
            background:rgba(0,0,0,0.6);
            padding:40px;
            border-radius:10px;
        }

        h1{
            font-size:60px;
            margin-bottom:20px;
        }

        .desc1{
            font-size:24px;
            margin-bottom:15px;
        }

        .desc2{
            font-size:18px;
            margin-bottom:25px;
        }

        .form{
            display:flex;
            justify-content:center;
            gap:10px;
        }

        input{
            padding:15px;
            width:300px;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        button{
            padding:15px 25px;
            background:red;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:darkred;
            transform:scale(1.05);
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="content">

            <h1>Unlimited Movies, TV Shows and More</h1>

            <p class="desc1">
                Watch anywhere. Cancel anytime.
            </p>

            <p class="desc2">
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <div class="form">

                <input
                type="email"
                placeholder="Email Address">

                <button>
                    Get Started >
                </button>

            </div>

        </div>

    </div>

</body>
</html>
