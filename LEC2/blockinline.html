<!DOCTYPE html>
<html>
<head>
    <title>Block vs Inline Elements</title>
</head>
<body>

    <h1>Block vs Inline Elements</h1>

    <h2>Block Elements (div)</h2>

    <div style="background-color:teal; color:white;">
        Div Element 1
    </div>

    <div style="background-color:crimson; color:white;">
        Div Element 2
    </div>

    <div style="background-color:darkorange; color:white;">
        Div Element 3
    </div>

    <h2>Inline Elements (span)</h2>

    <span style="background-color:gold; color:black;">
        Span 1
    </span>

    <span style="background-color:mediumorchid; color:white;">
        Span 2
    </span>

    <span style="background-color:limegreen; color:white;">
        Span 3
    </span>

</body>
</html>
