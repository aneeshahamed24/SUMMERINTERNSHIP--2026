<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCAS ERP Dashboard</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="erp.css">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        
        <div class="col-md-2 sidebar text-white p-3">

            <h4>HCAS ERP</h4>
            <hr>

            <a href="#">Dashboard</a>
            <a href="#">Students</a>
            <a href="#">Faculty</a>
            <a href="#">Attendance</a>
            <a href="#">Fees</a>

        </div>

        
        <div class="col-md-10">

            
            <nav class="navbar bg-light shadow p-3">

                <h4>
                    Hindustan College of Arts & Science, Chennai
                </h4>

                <button class="btn btn-primary">
                    Admin
                </button>

            </nav>

            
            <div class="row mt-4">

                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h2>4500</h2>
                            <p>Students</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h2>250</h2>
                            <p>Faculty</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h2>18</h2>
                            <p>Departments</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h2>92%</h2>
                            <p>Placement</p>
                        </div>
                    </div>
                </div>

            </div>

            
            <h3 class="mt-4">Students</h3>

            <div class="row">

                <div class="col-md-4 mt-3">
                    <div class="card text-center p-3">

                        <img src="student1.png" class="student-img mx-auto">

                        <h5 class="mt-2">
                            Aneesh Ahamed
                        </h5>

                        <p>BCA</p>

                    </div>
                </div>

                <div class="col-md-4 mt-3">
                    <div class="card text-center p-3">

                        <img src="student2.png" class="student-img mx-auto">

                        <h5 class="mt-2">
                            Priya Sharma
                        </h5>

                        <p>BCA</p>

                    </div>
                </div>

                <div class="col-md-4 mt-3">
                    <div class="card text-center p-3">

                        <img src="student3.png" class="student-img mx-auto">

                        <h5 class="mt-2">
                            Arjun Kumar
                        </h5>

                        <p>BCA</p>

                    </div>
                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
