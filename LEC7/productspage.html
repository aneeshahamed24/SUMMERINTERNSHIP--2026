<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <div class="card">
            <img src="product1.jpg" alt="Running Shoes">
            <h3>Running Shoes</h3>
            <p class="price">₹2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product2.jpg" alt="Coffee Mug">
            <h3>Coffee Mug</h3>
            <p class="price">₹399</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product3.jpg" alt="Indoor Plant">
            <h3>Indoor Plant</h3>
            <p class="price">₹599</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product4.jpg" alt="Backpack">
            <h3>Backpack</h3>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product5.jpg" alt="Wrist Watch">
            <h3>Wrist Watch</h3>
            <p class="price">₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product6.jpg" alt="Headphones">
            <h3>Wireless Headphones</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
